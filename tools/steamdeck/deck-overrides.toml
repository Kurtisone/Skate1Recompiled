# Settings the Steam Deck package uses on top of config/skate1.runtime.toml.
# Measured on an APU of the same class (Zen 2 + RDNA/Vega iGPU), Skate Libre
# tutorial scene: 8 FPS with the desktop settings, 15-18 FPS with these.
#
# Render at the console's native 720p instead of 2x: the Deck screen is 800p,
# and 2x costs about 4x the GPU time on the Vulkan backend.
draw_resolution_scale_x = 1
draw_resolution_scale_y = 1
# The photo readback drains the GPU 4 times per frame (the game resolves that
# 640x360 target 4x per frame). Off here; in-game photos come out black, as
# in builds before 0.3.
readback_resolve_force_length = 0
# The Deck plays with its controller. In Desktop Mode, Steam's desktop layout
# (and the controller's lizard mode) also send keyboard keys for the buttons
# (A -> Enter), which keyboard emulation turned into a second pad press: every
# button acted twice. Set back to true to play with a keyboard and mouse.
mnk_mode = false
# Open the quit dialog with the RB+Start chord only. Steam's desktop layout
# and the controller's lizard mode send Escape for the Start button, so the
# Escape bind opened the dialog on every Start press.
bind_quit = ''
# The Deck's speakers are stereo but PipeWire exposes them as a 5.1 sink.
# Passing the guest's 5.1 through left PipeWire to fold it, which crackled on
# voice and music; fold to stereo with the SDK's normalized mix instead.
audio_force_stereo = true
# The GPU emulation thread (PM4 to Vulkan translation) limits the frame rate
# in free skate. Measured on Zen 2 (Deck A/B and a headless PC benchmark):
# copy guest memory uploads before the render pass instead of ending it for
# each one (~420 render pass breaks and ~1000 barriers per frame otherwise),
# and submit once per frame instead of at each primary buffer end.
vulkan_hoist_shared_memory_uploads = true
vulkan_submit_on_primary_buffer_end = false
