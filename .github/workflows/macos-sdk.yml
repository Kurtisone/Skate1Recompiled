# Builds the patched ReXGlue SDK on an Apple Silicon runner. The game itself
# can't be built in CI (codegen needs the user's own game files), so this only
# checks that the SDK, runtime and rexglue tool compile and link on macOS.
name: macOS SDK build

on:
  push:
    branches: [main]
    paths: ["patches/**", "third_party/**", "CMakePresets.json", ".github/workflows/macos-sdk.yml"]
  pull_request:
    paths: ["patches/**", "third_party/**", "CMakePresets.json", ".github/workflows/macos-sdk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDK submodules
        run: |
          git submodule update --init third_party/rexglue-sdk
          cd third_party/rexglue-sdk
          # One at a time: a failed fetch stops a combined update early.
          for p in $(git config --file .gitmodules --get-regexp '\.path$' | awk '{print $2}'); do
            git submodule update --init --recursive --depth 1 "$p" || echo "::warning::could not fetch $p"
          done
          # The fork pins an imgui commit that is not fetchable; use a release.
          # Current master drops the ImGuiCol_TabActive names the SDK uses.
          if [ ! -f thirdparty/imgui/imgui.cpp ]; then
            git -C thirdparty/imgui fetch --depth 1 origin tag v1.92.2
            git -C thirdparty/imgui checkout v1.92.2
          fi
          if git submodule status --recursive | grep '^-'; then exit 1; fi

      - name: Apply SDK patch
        run: git -C third_party/rexglue-sdk apply ../../patches/rexglue-sdk.patch

      - name: Install toolchain
        run: brew install llvm ninja molten-vk vulkan-loader

      - name: Configure
        run: >
          cmake -S third_party/rexglue-sdk -B out/sdk -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=/opt/homebrew/opt/llvm/bin/clang
          -DCMAKE_CXX_COMPILER=/opt/homebrew/opt/llvm/bin/clang++
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DREXGLUE_ENABLE_TRACY=OFF
          -DREXGLUE_ENABLE_PERF_COUNTERS=OFF

      - name: Build
        run: cmake --build out/sdk --parallel

      - name: Upload rexglue tool
        uses: actions/upload-artifact@v4
        with:
          name: rexglue-macos-arm64
          path: out/sdk/**/rexglue
          if-no-files-found: warn
