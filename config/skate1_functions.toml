# Function boundary overrides for Skate 1 codegen.

# Redirect the CRT setjmp/longjmp to native versions (same fix as Skate 2:
# otherwise luaD_rawrunprotected never runs and Lua is left uninitialised).
# Found by matching the Skate 2 CRT routines byte-for-byte in the Skate 1 image.
setjmp_address = 0x82E50F20
longjmp_address = 0x82E48B60

[functions]

# Tail-branch targets the analysis misses (first codegen pass, unresolved calls).
"0x824103D8" = {}
"0x82E18798" = {} # addi r3,r3,4 ; b  (this-adjust thunk)
"0x82E1BBD0" = {} # addi r3,r3,4 ; b  (this-adjust thunk)

# Shared tail blocks placed directly before the function that branches back into
# them: "li r7,0" then a body ending with the blr just before the caller. Callers
# enter at both addresses. The +0 entry is a chunk of the caller (emitted as its
# own copy including the li), the +4 entry is a standalone function. Codegen has no
# fall-through between functions, so the body is intentionally duplicated.
"0x83024DD8" = { end = 0x83024E04, parent = 0x83024E04 }
"0x83024DDC" = { end = 0x83024E04 }
"0x8302D578" = { end = 0x8302D5A4, parent = 0x8302D5A4 }
"0x8302D57C" = { end = 0x8302D5A4 }
"0x8302FF18" = { end = 0x8302FF44, parent = 0x8302FF44 }
